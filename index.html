<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050906">
<title>365</title>
<style>
:root{
  --bg:#050906; --green:#83ff63; --green2:#3cae42;
  --text:#dce9dc; --muted:#7d927f; --line:#24402b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  min-height:100vh; overflow-x:hidden; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:
    radial-gradient(ellipse at 76% 17%,rgba(66,130,61,.22),transparent 28%),
    radial-gradient(ellipse at 24% 70%,rgba(25,98,40,.17),transparent 36%),
    linear-gradient(180deg,#071009 0%,#050906 65%,#030504 100%);
}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.moon{position:absolute;width:min(58vw,520px);aspect-ratio:1;right:8%;top:5%;
  border-radius:50%;background:
  radial-gradient(circle at 32% 28%,#a4d68a 0 1px,transparent 2px),
  radial-gradient(circle at 60% 64%,#18351f 0 8%,transparent 9%),
  radial-gradient(circle at 36% 58%,#24472a 0 12%,transparent 13%),
  radial-gradient(circle at 68% 30%,#254b2c 0 7%,transparent 8%),
  radial-gradient(circle at 45% 42%,#527d48,#1b3922 58%,#0c1a10 72%);
  box-shadow:0 0 70px #4bff5b20,inset -28px -18px 45px #020503;
  opacity:.55}
.city{position:absolute;bottom:0;left:0;right:0;height:55%;opacity:.65;
 background:linear-gradient(180deg,transparent,#07110a 65%,#020403)}
.tower{position:absolute;bottom:0;width:clamp(35px,7vw,90px);border:1px solid #1c3b25;
 background:linear-gradient(90deg,#07100a,#102417 50%,#050a06);
 box-shadow:inset 0 0 18px #46ff5420}
.tower:after{content:"";position:absolute;inset:12px 9px;background:repeating-linear-gradient(0deg,transparent 0 13px,#80ff5b88 14px 16px,transparent 17px 27px);opacity:.45}
.t1{height:48%;left:4%;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.t2{height:75%;left:18%;width:9%}
.t3{height:60%;left:36%;clip-path:polygon(50% 0,62% 18%,100% 100%,0 100%)}
.t4{height:88%;right:13%;width:10%;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.t5{height:52%;right:2%;width:8%}
.t6{height:39%;right:30%;width:7%}
.ring{position:absolute;border:2px solid #5eff6a66;border-radius:50%;width:190px;height:40px;transform:rotate(-9deg);box-shadow:0 0 16px #5eff6a22}
.r1{right:10%;top:35%}.r2{left:40%;top:51%;width:130px;height:27px}
main{position:relative;z-index:2;min-height:100vh;max-width:1120px;margin:auto;padding:34px 26px 26px;display:flex;flex-direction:column}
header{display:flex;justify-content:flex-end;align-items:center;color:#6c8970;font-size:10px;letter-spacing:.22em}
.live{display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}
.content{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(340px,1.1fr);gap:34px;align-items:end;flex:1;padding:6vh 0 5vh}
.pod-area{position:relative;display:flex;justify-content:center;align-items:end;min-height:440px}
.pod{
 width:min(100%,390px);height:430px;position:relative;border:2px solid #4c9c59;
 border-radius:48% 48% 16px 16px / 27% 27% 16px 16px;
 background:linear-gradient(115deg,#142d1d99,#07110dcc 52%,#17351d88);
 box-shadow:0 0 35px #4dff5830,inset 0 0 35px #60ff5a20;
 overflow:hidden
}
.pod:before{content:"";position:absolute;inset:12px;border:1px solid #76ff7566;border-radius:48% 48% 10px 10px / 27% 27% 10px 10px}
.pod-glow{position:absolute;left:12%;right:12%;bottom:0;height:25%;background:linear-gradient(0deg,#58ff6733,transparent);filter:blur(8px)}
.person{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:230px;height:260px;image-rendering:pixelated}
.hair{position:absolute;top:5px;left:54px;width:122px;height:76px;background:#100d0c;
 clip-path:polygon(15% 12%,30% 0,40% 9%,53% 0,64% 10%,80% 3%,100% 28%,92% 70%,80% 100%,15% 96%,0 65%,4% 28%)}
.face{position:absolute;top:57px;left:83px;width:70px;height:66px;background:#9b684a;clip-path:polygon(10% 0,90% 0,100% 65%,72% 100%,28% 100%,0 65%)}
.glasses{position:absolute;top:82px;left:82px;width:73px;height:17px;z-index:2}
.glasses:before,.glasses:after{content:"";position:absolute;top:0;width:31px;height:13px;background:#07100c;border:2px solid #6aff65;box-shadow:0 0 8px #61ff64}
.glasses:before{left:0;transform:skew(-12deg)}.glasses:after{right:0;transform:skew(-12deg)}
.glasses i{position:absolute;left:32px;top:5px;width:9px;height:2px;background:#71ff68}
.body{position:absolute;top:116px;left:43px;width:150px;height:115px;background:#080d0b;border:2px solid #1a2b20;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.arm{position:absolute;top:134px;width:40px;height:82px;background:#090e0b;border:1px solid #233c2a}
.arm.a{left:32px;transform:rotate(22deg)}.arm.b{right:32px;transform:rotate(-22deg)}
.leg{position:absolute;top:204px;width:91px;height:32px;background:#080b09;border:1px solid #24372a;border-radius:4px}
.leg.a{left:48px;transform:rotate(13deg)}.leg.b{right:39px;transform:rotate(-7deg)}
.shoe{position:absolute;top:229px;width:72px;height:23px;background:#090c0b;border:2px solid #718176;border-radius:3px 9px 5px 4px}
.shoe.a{left:33px}.shoe.b{right:28px}
.shoe:after{content:"";position:absolute;left:8px;right:8px;bottom:4px;border-bottom:2px solid #718176}
.zz{position:absolute;color:#9cff83;text-shadow:0 0 10px #78ff6d;font-size:19px}
.z1{top:100px;right:34px}.z2{top:75px;right:15px;font-size:14px}.z3{top:57px;right:0;font-size:11px}
.pod-base{height:25px;position:absolute;bottom:0;left:7%;right:7%;background:linear-gradient(90deg,#0a140d,#294d2e,#0a140d);border:1px solid #5aff65;box-shadow:0 0 22px #54ff5b33}
.cat{position:absolute;bottom:12px;left:12%;width:76px;height:26px;background:#030504;border-radius:50% 50% 20% 20%;filter:drop-shadow(0 0 4px #65ff65)}
.cat:before{content:"";position:absolute;top:-10px;left:8px;width:25px;height:20px;background:#030504;clip-path:polygon(0 0,45% 35%,100% 0,100% 100%,0 100%)}
.cat:after{content:"";position:absolute;right:14px;top:8px;width:4px;height:3px;background:#85ff69;box-shadow:-12px 0 #85ff69}
.right{padding-bottom:70px}
.kicker{font-size:11px;letter-spacing:.25em;color:#8fae91;margin-bottom:18px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#050a07b8;border-top:1px solid #47784d;border-bottom:1px solid #47784d;padding:22px 8px}
.unit{text-align:center;min-width:0}
.num{font-size:clamp(28px,5vw,56px);font-weight:700;color:var(--green);text-shadow:0 0 18px #67ff5a55;font-variant-numeric:tabular-nums}
.label{font-size:10px;color:#9ab99a;letter-spacing:.12em;margin-top:9px}
.divider{border-left:1px solid #47784d}
.subtle{color:#526b55;font-size:10px;letter-spacing:.18em;text-align:right;margin-top:16px}
footer{display:flex;justify-content:space-between;color:#425b47;font-size:9px;letter-spacing:.16em;padding-top:16px;border-top:1px solid #1b2e20}
@media(max-width:760px){
 main{padding:22px 16px 18px}.content{grid-template-columns:1fr;gap:8px;padding:3vh 0}
 .pod-area{min-height:360px;order:2}.pod{height:340px;width:290px}
 .person{transform:translateX(-50%) scale(.82);transform-origin:bottom center}
 .right{order:1;padding:25px 0 0}.kicker{text-align:center;margin-bottom:12px}
 .subtle{text-align:center}.moon{width:85vw;right:-15%;top:9%}
 footer{font-size:8px}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
 <div class="moon"></div><div class="ring r1"></div><div class="ring r2"></div>
 <div class="city"><i class="tower t1"></i><i class="tower t2"></i><i class="tower t3"></i><i class="tower t4"></i><i class="tower t5"></i><i class="tower t6"></i></div>
</div>
<main>
 <header><span class="live"><i class="dot"></i> SYSTEM ACTIVE</span></header>
 <section class="content">
  <div class="pod-area">
   <div class="pod">
    <div class="pod-glow"></div>
    <div class="person" aria-label="Petit personnage pixelisé endormi">
     <div class="hair"></div><div class="face"></div><div class="glasses"><i></i></div>
     <div class="body"></div><div class="arm a"></div><div class="arm b"></div>
     <div class="leg a"></div><div class="leg b"></div><div class="shoe a"></div><div class="shoe b"></div>
     <span class="zz z1">Z</span><span class="zz z2">Z</span><span class="zz z3">z</span>
    </div>
    <div class="pod-base"></div>
   </div>
   <div class="cat"></div>
  </div>
  <div class="right">
   <div class="kicker">COMPTE À REBOURS</div>
   <div class="timer" role="timer" aria-live="off">
    <div class="unit"><div class="num" id="days">365</div><div class="label">JOURS</div></div>
    <div class="unit divider"><div class="num" id="hours">00</div><div class="label">HEURES</div></div>
    <div class="unit divider"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div>
    <div class="unit divider"><div class="num" id="seconds">00</div><div class="label">SECONDES</div></div>
   </div>
   <div class="subtle" id="state">—</div>
  </div>
 </section>
 <footer><span>09.11.2026</span><span> </span><span>09.11.2027</span></footer>
</main>
<script>
const start = new Date("2026-11-09T00:00:00+01:00").getTime();
const deadline = new Date("2027-11-09T00:00:00+01:00").getTime();
const pad = n => String(n).padStart(2,"0");
function tick(){
 const now=Date.now(), left=Math.max(0,deadline-now);
 const elapsed=Math.min(365,Math.max(1,Math.floor((now-start)/86400000)+1));
 document.getElementById("days").textContent=Math.floor(left/86400000);
 document.getElementById("hours").textContent=pad(Math.floor(left%86400000/3600000));
 document.getElementById("minutes").textContent=pad(Math.floor(left%3600000/60000));
 document.getElementById("seconds").textContent=pad(Math.floor(left%60000/1000));
 document.getElementById("state").textContent=left===0?"":`DAY ${pad(elapsed)} / 365`;
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
